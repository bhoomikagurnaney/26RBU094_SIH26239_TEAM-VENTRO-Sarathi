<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sarathi, Scholarship &amp; Fellowship Platform (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233F;
    --ink-2:#223357;
    --paper:#F5F7F1;
    --panel:#FFFFFF;
    --gold:#C99A3E;
    --gold-deep:#A87B2A;
    --teal:#2F6F62;
    --teal-deep:#215048;
    --terracotta:#B5573A;
    --text:#1B2430;
    --muted:#5B6472;
    --line:#E1E4DD;
    --danger:#B5573A;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Newsreader',serif;}
  button{font-family:inherit;}
  ::selection{background:var(--gold); color:var(--ink);}

  a{color:inherit;}

  /* ---------- App shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 40px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg, var(--ink) 0%, var(--teal) 100%);
    position:relative; flex:none;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:9px;
    border-radius:50%;
    background:var(--gold);
  }
  .brand-text h1{margin:0; font-size:22px; font-weight:600; line-height:1;}
  .brand-text p{margin:2px 0 0; font-size:12px; color:var(--muted); letter-spacing:.02em;}

  .mode-toggle{
    display:flex; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px;
  }
  .mode-toggle button{
    border:none; background:transparent; padding:8px 18px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .mode-toggle button.active{background:var(--ink); color:#fff;}

  /* progress text under the heading on each screen - replaced the old top stepper bar
     (that thing used to flicker/lag when switching steps so we dropped it) */
  .progress-tag{
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
    color:var(--teal-deep); background:#EAF1EE; border:1px solid #D4E3DC;
    padding:4px 10px; border-radius:999px; margin-bottom:10px;
  }

  /* ---------- Main content ---------- */
  main{flex:1; padding:44px 40px 80px;}
  .stage{max-width:960px; margin:0 auto;}

  .eyebrow{font-size:13px; color:var(--teal-deep); font-weight:600; margin:0 0 10px;}
  .h-lg{font-size:38px; font-weight:600; line-height:1.15; margin:0 0 16px; max-width:640px;}
  .h-md{font-size:26px; font-weight:600; margin:0 0 10px;}
  .sub{font-size:16px; color:var(--muted); max-width:560px; line-height:1.55; margin:0 0 28px;}

  .btn{
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    border-radius:12px; border:none; padding:13px 24px; font-size:14.5px; font-weight:600;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4; cursor:not-allowed; pointer-events:none;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:var(--ink-2);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-gold:hover{background:var(--gold-deep); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:8px 14px; font-size:12.5px; border-radius:9px;}
  .btn-link{background:none; border:none; color:var(--teal-deep); font-weight:600; font-size:13.5px; cursor:pointer; padding:0;}

  .chip-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:26px;}
  .chip{
    padding:10px 18px; border-radius:999px; border:1.5px solid var(--line); background:#fff;
    font-size:13.5px; font-weight:600; color:var(--text); cursor:pointer;
  }
  .chip.selected{border-color:var(--ink); background:var(--ink); color:#fff;}

  .field-row{display:flex; gap:18px;}
  .field-row .field{flex:1; min-width:0;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:7px; text-transform:none;}
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    font-size:14.5px; font-family:inherit; background:#fff; color:var(--text);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:32px; margin-bottom:20px;
  }

  /* Scheme match cards */
  .scheme-grid{display:flex; gap:20px; margin-bottom:28px;}
  .scheme-grid .scheme-card{flex:1; min-width:0;}
  .scheme-card{
    background:var(--panel); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:26px; display:flex; flex-direction:column; gap:14px;
  }
  .scheme-card.eligible{border-color:var(--teal);}
  .scheme-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .scheme-name{font-size:19px; font-weight:600; margin:0;}
  .badge{
    font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px; white-space:nowrap;
    text-transform:none;
  }
  .badge.eligible{background:#E4F0EA; color:var(--teal-deep);}
  .badge.potential{background:#FBF0DC; color:var(--gold-deep);}
  .badge.not{background:#F5E6E1; color:var(--terracotta);}
  .badge.info{background:#EDEFF7; color:var(--ink);}
  .scheme-desc{font-size:13.5px; color:var(--muted); line-height:1.5; margin:0;}
  .crit-list{list-style:none; padding:0; margin:6px 0 0; display:flex; flex-direction:column; gap:7px;}
  .crit-list li{font-size:13px; display:flex; gap:8px; align-items:flex-start; color:var(--text);}
  .crit-mark{flex:none; width:16px; height:16px; border-radius:50%; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#fff; font-weight:700;}
  .crit-mark.ok{background:var(--teal);}
  .crit-mark.warn{background:var(--gold);}

  /* Document checklist */
  .doc-row{
    display:flex; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--line);
  }
  .doc-row:last-of-type{border-bottom:none;}
  .doc-icon{
    width:38px; height:38px; border-radius:9px; background:var(--paper); flex:none;
    display:flex; align-items:center; justify-content:center; color:var(--ink); font-weight:700; font-size:13px;
    border:1px solid var(--line);
  }
  .doc-info{flex:1; min-width:0;}
  .doc-name{font-size:14.5px; font-weight:600; margin:0 0 2px;}
  .doc-meta{font-size:12px; color:var(--muted); margin:0;}
  .doc-status{flex:none;}
  .status-pill{font-size:11px; font-weight:700; padding:5px 11px; border-radius:999px;}
  .status-pill.pending{background:#EEF0EC; color:var(--muted);}
  .status-pill.uploaded{background:#EDEFF7; color:var(--ink);}
  .status-pill.verified{background:#E4F0EA; color:var(--teal-deep);}
  .status-pill.flag{background:#F5E6E1; color:var(--terracotta);}
  .doc-actions{flex:none; margin-left:14px;}

  .deficiency-note{
    margin-top:10px; padding:14px 16px; background:#FBF3EF; border:1px solid #EAD3C8;
    border-radius:12px; font-size:13px; color:#7A3A25; display:flex; gap:12px; align-items:flex-start;
  }

  .verify-banner{
    display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:12px;
    background:#EEF3F0; margin-bottom:20px; font-size:13.5px; color:var(--teal-deep); font-weight:600;
  }
  .spinner{
    width:18px; height:18px; border-radius:50%; border:3px solid #cfe0d9; border-top-color:var(--teal);
    animation:spin .8s linear infinite; flex:none;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Timeline */
  .timeline{display:flex; flex-direction:column; margin-top:6px;}
  .tl-item{display:flex; gap:18px; position:relative; padding-bottom:32px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-line{position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--line);}
  .tl-item.done .tl-line{background:var(--teal);}
  .tl-dot{
    width:28px; height:28px; border-radius:50%; flex:none; z-index:1;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
    border:2px solid var(--line); background:#fff; color:var(--muted);
  }
  .tl-item.done .tl-dot{background:var(--teal); border-color:var(--teal); color:#fff;}
  .tl-item.current .tl-dot{background:var(--ink); border-color:var(--ink); color:#fff;}
  .tl-title{font-size:15px; font-weight:600; margin:0 0 3px;}
  .tl-desc{font-size:13px; color:var(--muted); margin:0;}
  .tl-time{font-size:11.5px; color:#9aa1ab; margin-top:4px;}

  .notif-list{display:flex; flex-direction:column; gap:0; margin-top:6px;}
  .notif{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  .notif:last-child{border-bottom:none;}
  .notif-chan{flex:none; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px; background:var(--paper); color:var(--muted); height:fit-content;}
  .notif-text{font-size:13.5px;}
  .notif-time{font-size:11.5px; color:#9aa1ab;}

  .two-col{display:flex; gap:24px; align-items:flex-start;}
  .two-col > .card:first-child{flex:1.3; min-width:0;}
  .two-col > .card:last-child{flex:.9; min-width:0;}

  /* ---------- Admin ---------- */
  .stat-grid{display:flex; gap:16px; margin-bottom:28px;}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; flex:1; min-width:0;}
  .stat-num{font-family:'Newsreader',serif; font-size:34px; font-weight:600; color:var(--ink); line-height:1;}
  .stat-label{font-size:12.5px; color:var(--muted); margin-top:6px;}

  .bar-row{display:flex; align-items:center; gap:14px; margin-bottom:12px;}
  .bar-label{width:70px; font-size:12.5px; font-weight:600; flex:none;}
  .bar-track{flex:1; background:var(--paper); border-radius:6px; height:10px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px;}
  .bar-count{width:28px; text-align:right; font-size:12.5px; color:var(--muted); flex:none;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:11.5px; color:var(--muted); font-weight:700;
    padding:0 10px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:14px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  .name-cell{font-weight:600;}
  .sub-cell{font-size:12px; color:var(--muted);}

  .status-tag{font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; white-space:nowrap;}
  .status-tag.Submitted{background:#EDEFF7; color:var(--ink);}
  .status-tag.UnderVerification{background:#FBF0DC; color:var(--gold-deep);}
  .status-tag.DeficiencyRaised{background:#F5E6E1; color:var(--terracotta);}
  .status-tag.Eligible{background:#E4F0EA; color:var(--teal-deep);}
  .status-tag.Selected{background:var(--ink); color:#fff;}
  .status-tag.NotSelected{background:#EEF0EC; color:var(--muted);}

  /* Drawer */
  .overlay{position:fixed; inset:0; background:rgba(22,35,63,.4); display:flex; justify-content:flex-end; z-index:40;}
  .drawer{
    width:420px; max-width:92vw; background:var(--panel); height:100%; padding:32px;
    overflow-y:auto; box-shadow:-8px 0 30px rgba(0,0,0,.12);
  }
  .drawer-close{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; float:right; line-height:1;}
  .extract-row{display:flex; justify-content:space-between; font-size:13px; padding:9px 0; border-bottom:1px dashed var(--line);}
  .extract-row span:first-child{color:var(--muted);}
  .conf{font-size:11px; color:var(--teal-deep); font-weight:700;}

  @media (max-width: 760px){
    .topbar, main{padding-left:20px; padding-right:20px;}
    .field-row, .scheme-grid, .two-col, .stat-grid{flex-direction:column;}
    .h-lg{font-size:28px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Sarathi prototype - SIH 2026, Team Ventro
// Plain vanilla JS, no framework. We just keep one big state object and
// re-render the whole #app div whenever something changes. Simple but
// works fine for a hackathon demo.

// -------- dummy data / config --------
const SCHEME_INFO = {
  NFST: { name:"National Fellowship for Scheduled Tribe (NFST)", desc:"Financial support for ST students pursuing eligible research programmes (M.Phil / Ph.D) within India." },
  NOS:  { name:"National Overseas Scholarship (NOS)", desc:"Financial support for ST students pursuing eligible Master's and Ph.D. programmes abroad." },
};

const DOC_SETS = {
  NFST: ["ST Certificate","Income Certificate","Identity Proof (Aadhaar)","Bank Passbook","Latest Academic Marksheet","Research Proposal / Admission Letter"],
  NOS:  ["ST Certificate","Income Certificate","Identity Proof (Aadhaar / Passport)","Bank Passbook","University Offer Letter","Passport & Visa Document"],
};

function seedApplications(){
  return [
    { id:1, name:"Sunita Oraon", state:"Jharkhand", scheme:"NFST", status:"Selected", docs:"Verified", submitted:"02 Sep 2026" },
    { id:2, name:"Ravi Bhagat", state:"Chhattisgarh", scheme:"NOS", status:"UnderVerification", docs:"Pending", submitted:"08 Sep 2026" },
    { id:3, name:"Meena Kondagoan", state:"Odisha", scheme:"NFST", status:"DeficiencyRaised", docs:"Needs Resubmission", submitted:"10 Sep 2026" },
    { id:4, name:"Deepak Meshram", state:"Maharashtra", scheme:"NOS", status:"Eligible", docs:"Verified", submitted:"11 Sep 2026" },
    { id:5, name:"Anjali Marandi", state:"West Bengal", scheme:"NFST", status:"NotSelected", docs:"Verified", submitted:"05 Sep 2026" },
  ];
}

// this is basically our "database" for the demo - everything lives here
let state = {
  mode: "applicant",     // "applicant" or "admin"
  step: 0,               // which screen we're on, 0 = start, 4 = status page
  lang: "English",
  inputMode: "Text",
  profile: { name:"", stateUt:"", course:"", field:"", income:"", institution:"" },
  matches: null,          // filled in after the profile form is submitted
  selectedScheme: null,
  docs: [],
  verifying: false,
  verifiedOnce: false,
  applications: seedApplications(),
  nextId: 6,
  drawerAppId: null,
};

// -------- eligibility rules --------
// NOTE: this is a simplified version of the real NFST/NOS criteria, good
// enough for demo purposes. income ceiling number is from the scheme page.
function computeMatches(p){
  const income = Number(p.income || 0);
  const incomeOk = income > 0 && income <= 600000;
  const incomeUnknown = !p.income;

  const out = {};

  // NFST, relevant for postgraduate research programmes in India
  if (p.course === "pg_research"){
    out.NFST = {
      status: incomeOk ? "eligible" : (incomeUnknown ? "potential" : "not"),
      reasons: [
        { text:"Category: Scheduled Tribe (ST)", ok:true },
        { text:"Programme: Eligible research programme in India", ok:true },
        { text: incomeOk ? "Family income within scheme ceiling" : "Family income requires verification against ceiling", ok: incomeOk },
      ],
    };
  } else {
    out.NFST = { status:"not", reasons:[
      { text:"Category: Scheduled Tribe (ST)", ok:true },
      { text:"NFST currently applies to eligible research programmes in India", ok:false },
    ]};
  }

  // NOS, relevant for Master's/PhD abroad
  if (p.course === "abroad"){
    out.NOS = {
      status: incomeOk ? "eligible" : (incomeUnknown ? "potential" : "not"),
      reasons: [
        { text:"Category: Scheduled Tribe (ST)", ok:true },
        { text:"Programme: Eligible Master's / Ph.D. abroad", ok:true },
        { text: incomeOk ? "Family income within scheme ceiling" : "Family income requires verification against ceiling", ok: incomeOk },
      ],
    };
  } else {
    out.NOS = { status:"not", reasons:[
      { text:"Category: Scheduled Tribe (ST)", ok:true },
      { text:"NOS currently applies to Master's / Ph.D. programmes abroad", ok:false },
    ]};
  }

  return out;
}

function statusBadge(status){
  if(status === "eligible") return '<span class="badge eligible">Eligible</span>';
  if(status === "potential") return '<span class="badge potential">Potentially Eligible</span>';
  return '<span class="badge not">Not Eligible</span>';
}

// small helpers used everywhere below
function esc(s){ return (s||"").toString().replace(/</g,"&lt;"); }

// used to give each screen a "Step 2 of 5" style tag instead of the old
// top progress bar (that bar was re-rendering wrong half the time)
function progressTag(n){
  return `<span class="progress-tag">STEP ${n} OF 5</span>`;
}

function topbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">
        <h1>Sarathi</h1>
        <p>AI-Enabled Scholarship &amp; Fellowship Platform &middot; Ministry of Tribal Affairs</p>
      </div>
    </div>
    <div class="mode-toggle">
      <button data-action="switch-mode" data-value="applicant" class="${state.mode==='applicant'?'active':''}">Applicant view</button>
      <button data-action="switch-mode" data-value="admin" class="${state.mode==='admin'?'active':''}">Admin view</button>
    </div>
  </div>`;
}

// -------- applicant-side screens --------
function screenStart(){
  const langs = ["English","Hindi","Marathi","Odia","Santali"];
  return `
  <div class="stage">
    <p class="eyebrow">Welcome</p>
    <h2 class="h-lg">Every eligible tribal student, matched to the right scholarship, without the paperwork maze.</h2>
    <p class="sub">Sarathi guides you from eligibility check to final decision in one place: NFST, NOS and other Ministry of Tribal Affairs schemes, on a single application.</p>

    <div class="card" style="max-width:640px;">
      <h3 class="h-md" style="font-size:16px;">Choose your language</h3>
      <div class="chip-row">
        ${langs.map(l=>`<button class="chip ${state.lang===l?'selected':''}" data-action="set-lang" data-value="${l}">${l}</button>`).join("")}
      </div>
      <h3 class="h-md" style="font-size:16px;">How would you like to apply?</h3>
      <div class="chip-row">
        <button class="chip ${state.inputMode==='Text'?'selected':''}" data-action="set-input" data-value="Text">Type my answers</button>
        <button class="chip ${state.inputMode==='Voice'?'selected':''}" data-action="set-input" data-value="Voice">Speak my answers</button>
      </div>
      <button class="btn btn-primary" data-action="goto-step" data-value="1">Begin your application</button>
    </div>
  </div>`;
}

function screenProfile(){
  const p = state.profile;
  return `
  <div class="stage">
    ${progressTag(2)}
    <h2 class="h-md">Tell us about you</h2>
    <p class="sub">This information is used to find every scheme you may qualify for. Category is fixed to Scheduled Tribe (ST) for this platform.</p>
    <form class="card" data-form="profile" style="max-width:760px;">
      <div class="field-row">
        <div class="field"><label>Full name</label><input required name="name" value="${esc(p.name)}" placeholder="As per certificate"/></div>
        <div class="field"><label>State / UT</label>
          <select name="stateUt" required>
            <option value="" ${!p.stateUt?'selected':''} disabled>Select state</option>
            ${["Jharkhand","Chhattisgarh","Odisha","Madhya Pradesh","Maharashtra","West Bengal","Gujarat","Rajasthan"].map(s=>`<option ${p.stateUt===s?'selected':''}>${s}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Programme level</label>
          <select name="course" required>
            <option value="" ${!p.course?'selected':''} disabled>Select programme</option>
            <option value="ug" ${p.course==='ug'?'selected':''}>Undergraduate (India)</option>
            <option value="pg_research" ${p.course==='pg_research'?'selected':''}>Postgraduate / Research, M.Phil, Ph.D (India)</option>
            <option value="abroad" ${p.course==='abroad'?'selected':''}>Master's / Ph.D. abroad</option>
          </select>
        </div>
        <div class="field"><label>Field of study</label><input required name="field" value="${esc(p.field)}" placeholder="e.g. Public Health"/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Institution / University</label><input required name="institution" value="${esc(p.institution)}" placeholder="Name of institution"/></div>
        <div class="field"><label>Annual family income (&#8377;)</label><input required type="number" min="0" name="income" value="${esc(p.income)}" placeholder="e.g. 350000"/></div>
      </div>
      <button class="btn btn-primary" type="submit">Check my eligibility</button>
      <button class="btn btn-ghost" type="button" data-action="goto-step" data-value="0" style="margin-left:10px;">Back</button>
    </form>
  </div>`;
}

function critList(reasons){
  return `<ul class="crit-list">${reasons.map(r=>`<li><span class="crit-mark ${r.ok?'ok':'warn'}">${r.ok?'&#10003;':'!'}</span>${r.text}</li>`).join("")}</ul>`;
}

function screenMatch(){
  const m = state.matches;
  const bothNot = m.NFST.status==="not" && m.NOS.status==="not";
  return `
  <div class="stage">
    ${progressTag(3)}
    <h2 class="h-md">Your scheme match</h2>
    <p class="sub">Based on your profile, here is how you stand against the two schemes currently configured on this platform.</p>
    <div class="scheme-grid">
      ${["NFST","NOS"].map(key=>{
        const s = m[key]; const info = SCHEME_INFO[key];
        return `<div class="scheme-card ${s.status==='eligible'?'eligible':''}">
          <div class="scheme-top"><h3 class="scheme-name">${key}</h3>${statusBadge(s.status)}</div>
          <p class="scheme-desc">${info.desc}</p>
          ${critList(s.reasons)}
          <button class="btn btn-gold btn-sm" style="align-self:flex-start; margin-top:6px;" ${s.status==='not'?'disabled':''} data-action="choose-scheme" data-value="${key}">Continue with ${key}</button>
        </div>`;
      }).join("")}
    </div>
    ${bothNot ? `<div class="card" style="padding:20px 24px;"><p class="sub" style="margin:0;">Your current programme level doesn't match NFST or NOS criteria today. You can still open a file for manual review by an officer.</p><button class="btn btn-ghost btn-sm" style="margin-top:10px;" data-action="choose-scheme" data-value="NFST">Continue for manual review</button></div>` : ""}
    <button class="btn btn-ghost" data-action="goto-step" data-value="1">Back to profile</button>
  </div>`;
}

function docIconLabel(name){
  return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function screenDocuments(){
  const flagged = state.docs.find(d=>d.status==='flag');
  const allVerified = state.docs.length>0 && state.docs.every(d=>d.status==='verified');
  const allUploaded = state.docs.every(d=>d.uploaded);
  return `
  <div class="stage">
    ${progressTag(4)}
    <h2 class="h-md">Upload documents for ${state.selectedScheme}</h2>
    <p class="sub">Upload each required document, then run AI verification. The system extracts key fields with OCR and flags anything that needs your attention.</p>

    ${state.verifying ? `<div class="verify-banner"><div class="spinner"></div> Running OCR extraction and cross-document validation&hellip;</div>` : ""}
    ${flagged ? `<div class="deficiency-note"><strong>Action needed:</strong>&nbsp;${flagged.deficiencyReason} Please re-upload a clearer copy of &ldquo;${flagged.name}&rdquo;.</div>` : ""}

    <div class="card">
      ${state.docs.map(d=>`
        <div class="doc-row">
          <div class="doc-icon">${docIconLabel(d.name)}</div>
          <div class="doc-info">
            <p class="doc-name">${d.name}</p>
            <p class="doc-meta">${d.uploaded ? (d.filename + (d.extracted ? " &middot; " + d.extracted : "")) : "No file uploaded yet"}</p>
          </div>
          <div class="doc-status"><span class="status-pill ${d.status}">${d.status==='pending'?'Pending':d.status==='uploaded'?'Uploaded':d.status==='verified'?'Verified':'Needs resubmission'}</span></div>
          <div class="doc-actions">
            ${d.status==='flag'
              ? `<button class="btn btn-gold btn-sm" data-action="reupload-doc" data-value="${d.name}">Reupload</button>`
              : `<button class="btn btn-ghost btn-sm" data-action="upload-doc" data-value="${d.name}">${d.uploaded?'Replace':'Upload'}</button>`}
          </div>
        </div>`).join("")}
    </div>

    <div style="display:flex; gap:12px; align-items:center;">
      <button class="btn btn-primary" ${(!allUploaded || state.verifying)?'disabled':''} data-action="run-verification">Run AI verification</button>
      <button class="btn btn-gold" ${!allVerified?'disabled':''} data-action="submit-application">Submit application</button>
      <button class="btn btn-ghost" data-action="goto-step" data-value="2">Back</button>
    </div>
  </div>`;
}

function screenStatus(){
  const app = state.applications.find(a=>a.id === state.lastAppId);
  const items = [
    { title:"Application submitted", desc:"Your application and documents were received.", done:true, time: app ? app.submitted : "" },
    { title:"Document verification", desc:"OCR and cross-document checks completed.", done:true, time:"Same day" },
    { title:"Eligibility confirmed", desc:`Confirmed eligible for ${state.selectedScheme}.`, done:true, time:"Same day" },
    { title:"Under selection review", desc:"An officer is reviewing your application against scheme criteria.", done:false, current:true, time:"In progress" },
    { title:"Final decision", desc:"Selection outcome will appear here once announced.", done:false, time:"Pending" },
  ];
  return `
  <div class="stage">
    ${progressTag(5)}
    <h2 class="h-md">Application status</h2>
    <p class="sub">Track every stage of your ${state.selectedScheme} application below. You'll be notified the moment something changes.</p>
    <div class="two-col">
      <div class="card">
        <div class="timeline">
          ${items.map((it,i)=>`
            <div class="tl-item ${it.done?'done':''} ${it.current?'current':''}">
              ${i<items.length-1?'<div class="tl-line"></div>':''}
              <div class="tl-dot">${it.done?'&#10003;':(i+1)}</div>
              <div>
                <p class="tl-title">${it.title}</p>
                <p class="tl-desc">${it.desc}</p>
                <p class="tl-time">${it.time}</p>
              </div>
            </div>`).join("")}
        </div>
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px; font-size:15px;">Notifications</h3>
        <div class="notif-list">
          <div class="notif"><span class="notif-chan">PORTAL</span><div><div class="notif-text">Application submitted successfully.</div><div class="notif-time">Just now</div></div></div>
          <div class="notif"><span class="notif-chan">SMS</span><div><div class="notif-text">Document verification completed.</div><div class="notif-time">Just now</div></div></div>
          <div class="notif"><span class="notif-chan">EMAIL</span><div><div class="notif-text">Your application has moved to selection review.</div><div class="notif-time">Just now</div></div></div>
        </div>
      </div>
    </div>
    <button class="btn btn-ghost" data-action="reset-flow">Start a new application</button>
    <button class="btn btn-ghost" data-action="switch-mode" data-value="admin">View in Admin dashboard</button>
  </div>`;
}

function renderApplicant(){
  let body = "";
  if(state.step===0) body = screenStart();
  else if(state.step===1) body = screenProfile();
  else if(state.step===2) body = screenMatch();
  else if(state.step===3) body = screenDocuments();
  else body = screenStatus();
  return `<main>${body}</main>`;
}

// -------- admin-side screens --------
function renderAdmin(){
  const apps = state.applications;
  const total = apps.length;
  const underVerification = apps.filter(a=>a.status==="UnderVerification").length;
  const deficiencies = apps.filter(a=>a.status==="DeficiencyRaised").length;
  const selected = apps.filter(a=>a.status==="Selected").length;
  const nfstCount = apps.filter(a=>a.scheme==="NFST").length;
  const nosCount = apps.filter(a=>a.scheme==="NOS").length;
  const maxCount = Math.max(nfstCount, nosCount, 1);

  const statusLabel = s => ({Submitted:"Submitted",UnderVerification:"Under Verification",DeficiencyRaised:"Deficiency Raised",Eligible:"Eligible",Selected:"Selected",NotSelected:"Not Selected"}[s] || s);

  return `<main>
    <div class="stage" style="max-width:1080px;">
      <p class="eyebrow">Administrator dashboard</p>
      <h2 class="h-md">Applications overview</h2>

      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">Total applications</div></div>
        <div class="stat-card"><div class="stat-num">${underVerification}</div><div class="stat-label">Under verification</div></div>
        <div class="stat-card"><div class="stat-num">${deficiencies}</div><div class="stat-label">Deficiencies flagged</div></div>
        <div class="stat-card"><div class="stat-num">${selected}</div><div class="stat-label">Selected candidates</div></div>
      </div>

      <div class="card">
        <h3 style="margin:0 0 16px; font-size:15px;">Applications by scheme</h3>
        <div class="bar-row"><div class="bar-label">NFST</div><div class="bar-track"><div class="bar-fill" style="width:${(nfstCount/maxCount)*100}%; background:var(--teal);"></div></div><div class="bar-count">${nfstCount}</div></div>
        <div class="bar-row"><div class="bar-label">NOS</div><div class="bar-track"><div class="bar-fill" style="width:${(nosCount/maxCount)*100}%; background:var(--gold);"></div></div><div class="bar-count">${nosCount}</div></div>
      </div>

      <div class="card" style="padding:24px 24px 8px;">
        <h3 style="margin:0 0 14px; font-size:15px;">All applications</h3>
        <table>
          <thead><tr><th>Applicant</th><th>Scheme</th><th>Submitted</th><th>Documents</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${apps.map(a=>`
              <tr>
                <td><div class="name-cell">${a.name}</div><div class="sub-cell">${a.state}</div></td>
                <td>${a.scheme}</td>
                <td>${a.submitted}</td>
                <td>${a.docs}</td>
                <td><span class="status-tag ${a.status}">${statusLabel(a.status)}</span></td>
                <td><button class="btn btn-ghost btn-sm" data-action="open-drawer" data-value="${a.id}">Review</button></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </main>`;
}

function renderDrawer(){
  if(state.drawerAppId == null) return "";
  const a = state.applications.find(x=>x.id === state.drawerAppId);
  if(!a) return "";
  return `
  <div class="overlay" data-action="close-drawer">
    <div class="drawer" onclick="event.stopPropagation()">
      <button class="drawer-close" data-action="close-drawer">&times;</button>
      <p class="eyebrow" style="margin-top:6px;">Application review</p>
      <h3 style="margin:0 0 4px;">${a.name}</h3>
      <p class="sub" style="margin:0 0 20px; max-width:none;">${a.scheme} &middot; ${a.state} &middot; Submitted ${a.submitted}</p>

      <h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:0 0 8px;">Extracted document data</h4>
      <div class="extract-row"><span>ST Certificate No.</span><span>ST/${a.state.slice(0,2).toUpperCase()}/20194 &nbsp;<span class="conf">96%</span></span></div>
      <div class="extract-row"><span>Income Certificate</span><span>&#8377;3,80,000 &nbsp;<span class="conf">91%</span></span></div>
      <div class="extract-row"><span>Academic record</span><span>CGPA 8.4 / 10 &nbsp;<span class="conf">98%</span></span></div>
      <div class="extract-row"><span>Bank account</span><span>Verified, IFSC matched &nbsp;<span class="conf">99%</span></span></div>

      <h4 style="font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:20px 0 8px;">Officer decision</h4>
      <p class="sub" style="margin:0 0 16px;">AI recommendation: <strong>${a.status==='DeficiencyRaised' ? 'Request resubmission' : 'Eligible, proceed to selection'}</strong>. Final decision remains with the reviewing officer.</p>
      <button class="btn btn-primary btn-sm" data-action="approve-app" data-value="${a.id}">Approve &amp; mark eligible</button>
      <button class="btn btn-ghost btn-sm" style="margin-left:8px;" data-action="flag-app" data-value="${a.id}">Request resubmission</button>
    </div>
  </div>`;
}

// re-draws everything. kept as one function so we don't have to think
// about keeping bits of the DOM in sync manually
function render(){
  const app = document.getElementById("app");
  app.innerHTML = topbar() + (state.mode === "applicant" ? renderApplicant() : renderAdmin()) +
    renderDrawer();
}

// -------- click handling (one big listener instead of binding each button) --------
function buildDocs(scheme){
  return DOC_SETS[scheme].map(name => ({ name, uploaded:false, status:"pending", filename:"", extracted:"" }));
}

document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const action = t.dataset.action;
  const value = t.dataset.value;

  if(action === "switch-mode"){ state.mode = value; render(); }
  else if(action === "set-lang"){ state.lang = value; render(); }
  else if(action === "set-input"){ state.inputMode = value; render(); }
  else if(action === "goto-step"){ state.step = Number(value); render(); }
  else if(action === "choose-scheme"){
    state.selectedScheme = value;
    state.docs = buildDocs(value);
    state.verifiedOnce = false;
    state.step = 3;
    render();
  }
  else if(action === "upload-doc" || action === "reupload-doc"){
    const d = state.docs.find(x=>x.name === value);
    d.uploaded = true;
    d.filename = value.replace(/[^a-zA-Z0-9]+/g,"_").toLowerCase() + "_scan.pdf";
    d.status = "uploaded";
    d.extracted = "";
    render();
  }
  else if(action === "run-verification"){
    state.verifying = true; render();
    setTimeout(()=>{
      state.verifying = false;
      const flagTarget = state.verifiedOnce ? null : state.docs.find(x=>x.name === "Income Certificate");
      state.docs.forEach(d=>{
        if(flagTarget && d.name === flagTarget.name){
          d.status = "flag";
          d.deficiencyReason = "The expiry date on this certificate is not clearly readable.";
          d.extracted = "OCR confidence low (62%)";
        } else {
          d.status = "verified";
          d.extracted = "Fields extracted &middot; confidence 95%+";
        }
      });
      state.verifiedOnce = true;
      render();
    }, 1000);
  }
  else if(action === "submit-application"){
    const id = state.nextId++;
    const today = "16 Sep 2026";
    state.applications.push({
      id, name: state.profile.name || "New Applicant", state: state.profile.stateUt || "N/A",
      scheme: state.selectedScheme, status:"UnderVerification", docs:"Verified", submitted: today,
    });
    state.lastAppId = id;
    state.step = 4;
    render();
  }
  else if(action === "reset-flow"){
    state.step = 0; state.profile = { name:"", stateUt:"", course:"", field:"", income:"", institution:"" };
    state.matches = null; state.selectedScheme = null; state.docs = []; state.verifiedOnce = false;
    render();
  }
  else if(action === "open-drawer"){ state.drawerAppId = Number(value); render(); }
  else if(action === "close-drawer"){ state.drawerAppId = null; render(); }
  else if(action === "approve-app"){
    const a = state.applications.find(x=>x.id === Number(value));
    if(a) a.status = "Eligible";
    state.drawerAppId = null; render();
  }
  else if(action === "flag-app"){
    const a = state.applications.find(x=>x.id === Number(value));
    if(a) a.status = "DeficiencyRaised";
    state.drawerAppId = null; render();
  }
});

document.addEventListener("submit", (e)=>{
  if(e.target.dataset.form === "profile"){
    e.preventDefault();
    const fd = new FormData(e.target);
    state.profile = {
      name: fd.get("name"), stateUt: fd.get("stateUt"), course: fd.get("course"),
      field: fd.get("field"), institution: fd.get("institution"), income: fd.get("income"),
    };
    state.matches = computeMatches(state.profile);
    state.step = 2;
    render();
  }
});

render();
</script>
</body>
</html>
